<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #f4f4f5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 32px;
        text-align: center;
      }
      .card { max-width: 420px; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #10b981, #059669);
        display: grid; place-items: center;
        font-size: 30px; font-weight: 800; color: #04110c;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #a1a1aa; line-height: 1.6; margin: 0 0 24px; }
      button {
        border: 0; border-radius: 12px; padding: 14px 22px;
        background: #10b981; color: #04110c; font-weight: 700; font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">W2</div>
      <h1>You're offline</h1>
      <p>The app could not reach the website. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
