<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Web2App Studio</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0a0a0a; color: #f4f4f5; font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center; padding: 32px;
      }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
        background: linear-gradient(135deg, #10b981, #059669);
        display: grid; place-items: center; font-weight: 800; color: #04110c; font-size: 30px;
      }
      p { color: #a1a1aa; }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">W2</div>
      <h1>Starting your app…</h1>
      <p>This packaged shell is only used when the website cannot be loaded.</p>
    </div>
  </body>
</html>
