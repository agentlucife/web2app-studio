name: iOS Build
on:
  workflow_dispatch:
    inputs:
      project_id:
        required: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build IPA
        run: |
          echo "Building iOS app for ${{ inputs.project_id }}"
          # Add xcodebuild steps here
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: "**/*.ipa"
